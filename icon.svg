<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Top gradient: blue to purple to orange -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="25%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#EC4899"/>
      <stop offset="75%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
    
    <!-- Bottom gradient: dark navy to deep blue -->
    <linearGradient id="bottomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1B4B"/>
      <stop offset="100%" style="stop-color:#0F0A2A"/>
    </linearGradient>
    
    <!-- Inner glow for central area -->
    <radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
    
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
    
    <!-- Border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="25%" style="stop-color:#A78BFA"/>
      <stop offset="50%" style="stop-color:#F472B6"/>
      <stop offset="75%" style="stop-color:#FB923C"/>
      <stop offset="100%" style="stop-color:#F87171"/>
    </linearGradient>
  </defs>
  
  <!-- Background - rounded rectangle frame -->
  <rect width="512" height="512" rx="64" fill="#0F0A2A"/>
  
  <!-- Outer gradient border -->
  <rect x="4" y="4" width="504" height="504" rx="60" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>
  
  <!-- Top section with gradient background -->
  <polygon points="256,32 476,192 476,288 256,200 36,288 36,192" 
           fill="url(#topGrad)" opacity="0.9"/>
  
  <!-- Inner content area with rounded edges -->
  <rect x="80" y="160" width="352" height="200" rx="20" fill="url(#bottomGrad)" opacity="0.95"/>
  <rect x="80" y="160" width="352" height="200" rx="20" fill="url(#innerGlow)"/>
  
  <!-- Grid pattern overlay on data area -->
  <rect x="80" y="160" width="352" height="200" rx="20" fill="url(#grid)"/>
  
  <!-- Central diamond frame around Bitcoin symbol -->
  <polygon points="256,180 400,260 256,340 112,260" 
           fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.8"/>
  <polygon points="256,188 388,260 256,332 124,260" 
           fill="rgba(255,255,255,0.05)" stroke="none"/>
  
  <!-- Bitcoin ₿ symbol in center -->
  <g transform="translate(256, 260)">
    <!-- Vertical bars -->
    <rect x="-70" y="-55" width="14" height="110" rx="3" fill="url(#topGrad)"/>
    
    <!-- B-shape -->
    <path d="
      M -30 -55
      L 50 -55
      Q 85 -55 85 -30
      Q 85 -10 65 0
      Q 85 10 85 35
      Q 85 55 50 55
      L -30 55
      Z
    " fill="url(#topGrad)"/>
    <!-- Horizontal connections -->
    <rect x="-40" y="-55" width="90" height="10" rx="3" fill="url(#topGrad)"/>
    <rect x="-40" y="45" width="90" height="10" rx="3" fill="url(#topGrad)"/>
  </g>
  
  <!-- Data visualization - price line chart (left side) -->
  <g transform="translate(100, 180)">
    <!-- Line -->
    <polyline points="0,40 25,30 50,35 75,20 100,25 125,15 150,22 175,10 200,18" 
              fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <!-- Area under line -->
    <polygon points="0,40 25,30 50,35 75,20 100,25 125,15 150,22 175,10 200,18 200,80 0,80" 
             fill="url(#topGrad)" opacity="0.2"/>
  </g>
  
  <!-- Candlestick/bar chart (right side) -->
  <g transform="translate(320, 200)">
    <!-- Bar 1 -->
    <rect x="0" y="20" width="12" height="60" rx="2" fill="#60A5FA" opacity="0.7"/>
    <!-- Bar 2 -->
    <rect x="20" y="40" width="12" height="40" rx="2" fill="#A78BFA" opacity="0.7"/>
    <!-- Bar 3 -->
    <rect x="40" y="10" width="12" height="70" rx="2" fill="#F472B6" opacity="0.7"/>
    <!-- Bar 4 -->
    <rect x="60" y="30" width="12" height="50" rx="2" fill="#FB923C" opacity="0.7"/>
    <!-- Bar 5 -->
    <rect x="80" y="50" width="12" height="30" rx="2" fill="#F87171" opacity="0.7"/>
    <!-- Bar 6 -->
    <rect x="100" y="25" width="12" height="55" rx="2" fill="#60A5FA" opacity="0.7"/>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="80" y="360" width="352" height="2" fill="url(#borderGrad)" opacity="0.5"/>
  
  <!-- "Bitcoin Family" text at bottom -->
  <text x="256" y="470" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" 
        text-anchor="middle" fill="url(#topGrad)">Bitcoin Family</text>
  
  <!-- Subtle corner decorations -->
  <circle cx="60" cy="60" r="8" fill="url(#topGrad)" opacity="0.6"/>
  <circle cx="452" cy="60" r="8" fill="url(#topGrad)" opacity="0.6"/>
  <circle cx="60" cy="452" r="8" fill="url(#topGrad)" opacity="0.6"/>
  <circle cx="452" cy="452" r="8" fill="url(#topGrad)" opacity="0.6"/>
</svg>
